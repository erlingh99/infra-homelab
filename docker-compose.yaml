
services:
  # -- DHCP and DNS (ad-block) --
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    hostname: pihole
    network_mode: host
    environment:
      TZ: 'Europe/Oslo'
      FTLCONF_webserver_api_password: ${WEBSERVER_PASSWORD}
      FTLCONF_LOCAL_IPV4: ${HOST_IP}
      FTLCONF_webserver_port: 8080
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    restart: unless-stopped

  # -- Reverse Proxy --
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    dns:
      - ${HOST_IP}
    ports:
      - "80:80"
      - "443:443"
    networks:
      - proxy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # -- VPN --
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    dns:
      - ${HOST_IP}
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-routes=${LAN_SUBNET} --accept-dns=false --advertise-exit-node
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false

  # -- File sharing --
  copyparty:
    image: copyparty/ac:latest
    container_name: copyparty
    restart: unless-stopped
    stop_grace_period: 15s
    dns:
      - ${HOST_IP}
    # run as the host user that owns COPYPARTY_ROOT
    user: "${COPYPARTY_UID:-1000}:${COPYPARTY_GID:-1000}"
    ports:
      - "3923:3923"
    networks:
      - proxy
    volumes:
      - ${COPYPARTY_ROOT}:/w
      - copyparty-cfg:/cfg
      - ./copyparty.conf:/cfg/copyparty.conf:ro
    environment:
      - TZ=Europe/Oslo
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3923/?reset"]
      interval: 1m
      timeout: 5s
      retries: 3

volumes:
  caddy-data:
  caddy-config:
  tailscale-state:
  copyparty-cfg:

networks:
  proxy:
    name: proxy
    driver: bridge
