
services:

  # -- Certificate Authority --
  step-ca:
    image: smallstep/step-ca:latest
    container_name: step-ca
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - step-ca-data:/home/step
      - ./password.txt:/home/step/password.txt:ro
    environment:
      - DOCKER_STEPCA_INIT_NAME=Homelab CA
      - DOCKER_STEPCA_INIT_DNS_NAMES=step-ca,step-ca.lan,${HOST_IP}
      - DOCKER_STEPCA_INIT_ACME=true
      - DOCKER_STEPCA_INIT_PASSWORD_FILE=/home/step/password.txt

  # -- Reverse Proxy --
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - proxy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./root_ca.crt:/etc/caddy/root_ca.crt:ro
      - ../leafy/Caddyfile:/srv/apps/leafy:ro #add one line per app
      - caddy-data:/data
      - caddy-config:/config

  # -- VPN --
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--accept-dns=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false

volumes:
  step-ca-data:
  caddy-data:
  caddy-config:
  tailscale-state:

networks:
  proxy:
    name: proxy
    driver: bridge
