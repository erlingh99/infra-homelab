
services:
  # -- DHCP and DNS (ad-block) --
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    hostname: pihole
    network_mode: host
    environment:
      TZ: 'Europe/Oslo'
      FTLCONF_webserver_api_password: ${WEBSERVER_PASSWORD}
      FTLCONF_LOCAL_IPV4: ${HOST_IP}
      FTLCONF_webserver_port: 8080
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    restart: unless-stopped

  # -- Certificate Authority --
  step-ca:
    image: smallstep/step-ca:latest
    container_name: step-ca
    restart: unless-stopped
    dns:
      - ${HOST_IP}
    extra_hosts:
      - "pihole.lan:host-gateway"
    networks:
      - proxy
    volumes:
      - step-ca-data:/home/step
      - ./password.txt:/home/step/password.txt:ro
    environment:
      - DOCKER_STEPCA_INIT_NAME=Homelab CA
      - DOCKER_STEPCA_INIT_DNS_NAMES=step-ca,step-ca.lan,${HOST_IP}
      - DOCKER_STEPCA_INIT_ACME=true
      - DOCKER_STEPCA_INIT_PASSWORD_FILE=/home/step/password.txt

  # -- Reverse Proxy --
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    dns:
      - ${HOST_IP}
    ports:
      - "80:80"
      - "443:443"
    networks:
      - proxy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./root_ca.crt:/etc/caddy/root_ca.crt:ro
      - caddy-data:/data
      - caddy-config:/config

  # -- VPN --
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    dns:
      - ${HOST_IP}
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-routes=${LAN_SUBNET} --accept-dns=false --advertise-exit-node
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false

volumes:
  step-ca-data:
  caddy-data:
  caddy-config:
  tailscale-state:

networks:
  proxy:
    name: proxy
    driver: bridge
