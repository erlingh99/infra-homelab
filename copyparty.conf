# homelab/copyparty.conf
# picked up by the image's built-in config, which does "% /cfg"
# inline comments need two spaces before the #

[global]
  xff-src: lan   # trust x-forwarded-for from caddy on the proxy network
  chmod-f: 666   # new uploads stay editable by other users on the host
  chmod-d: 777   # new folders too, so others can add files inside them
  ansi           # colors in the docker logs

  e2dsa                # index files for search
  e2ts                 # read tags from media files
  hist: /cfg/hist      # keep the index db and thumbs out of the shared folder
  re-maxage: 3600      # rescan hourly, so files added or edited by other
                       # processes on the host show up in search with fresh tags

  dedup                # store a duplicate upload once instead of twice.
  reflink              # ALWAYS keep reflink next to dedup: it makes the
                       # copy a filesystem-level copy-on-write clone,
                       # instead of the sym/hardlink that plain dedup
                       # uses. links would be unsafe here, since editing
                       # a file from any other program would change every
                       # copy of it. a CoW clone is a real independent
                       # file, so that cannot happen.
                       # needs a CoW filesystem (btrfs, xfs with
                       # reflink=1, zfs 2.2+); on ext4 the clone fails
                       # and copyparty just writes a full copy, which is
                       # equally safe, only without the space savings.
                       # see https://github.com/9001/copyparty/discussions/1397

  # no-clone           # when an upload duplicates a file already on disk,
                       # copy the existing file instead of transferring.
                       # there is a tiny toctou window there if another
                       # process edits that file mid-copy; no-clone
                       # removes it, at the cost of re-uploading instead

  shr: /share    # share-links are served from /share
  shr-who: a     # who may create them: "a" = has admin permission, which the
                 # volume below grants everyone. the default ("auth") means
                 # logged-in users only, and nobody can log in here
  # shr-db defaults to /cfg/shares.db, which persists in the copyparty-cfg volume

# no [accounts] section, so there is nobody to log in as

[/]        # volume at the webroot
  /w       # shares ${COPYPARTY_ROOT} from the host
  accs:
    A: *   # everyone gets all perms: read write move delete admin
